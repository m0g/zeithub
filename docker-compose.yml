# Zeithub: one container, one SQLite file.
#
#   export NUXT_APP_SECRET=$(openssl rand -base64 32)
#   docker compose up -d
#
# then open http://localhost:8080
services:
  zeithub:
    image: m0gd0ck/zeithub:latest
    build: .
    restart: unless-stopped
    environment:
      # Required (32+ chars). Not enforced with ${VAR:?} here because that
      # also fails `docker compose build` (e.g. on Coolify, where runtime
      # variables aren't present at build time); the server checks it on
      # startup instead (server/plugins/check-config.ts).
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:-}
      # Session cookies are HTTPS-only (localhost excepted). Uncomment if you
      # reach Zeithub over plain HTTP on another address.
      # NUXT_SESSION_COOKIE_SECURE: 'false'
    ports:
      - '8080:3000'
    volumes:
      - zeithub-data:/data

volumes:
  zeithub-data:
